[project]
name = "g7-retail-analytics-final-project"
version = "0.1.0"
description = "End-to-end retail analytics project covering customer segmentation, campaign response prediction, sentiment analysis, FastAPI deployment, Docker and CI."
readme = "README.md"
authors = [
    { name = "MateusVeloso16", email = "mateus.16.veloso@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "uvicorn>=0.53.0",
    "xgboost>=3.4.1",
]

[project.scripts]
g7-retail-analytics-final-project = "g7_retail_analytics_final_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
